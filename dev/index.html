<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>suunto-cards dev harness</title>
<style>
  :root {
    --primary-text-color: #2e3238;
    --secondary-text-color: #6b7178;
    --divider-color: #e5e2da;
    --card-background-color: #ffffff;
    --ha-card-border-radius: 12px;
    --ha-card-box-shadow: 0 1px 2px rgba(20, 20, 20, 0.06), 0 4px 14px rgba(20, 20, 20, 0.06);
    color-scheme: light;
  }
  body.dark {
    --primary-text-color: #ecedee;
    --secondary-text-color: #9ba1a8;
    --divider-color: rgba(255, 255, 255, 0.09);
    --card-background-color: #1e2124;
    --ha-card-box-shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 6px 20px rgba(0, 0, 0, 0.35);
    color-scheme: dark;
  }
  body {
    margin: 0;
    padding: 24px;
    background: #f4f2ed;
    font-family: Segoe UI, Roboto, Helvetica, Arial, sans-serif;
  }
  body.dark {
    background: #16181b;
  }
  h1 {
    color: var(--primary-text-color);
    font-size: 1.1rem;
  }
  button#toggle,
  select#lang {
    margin-bottom: 20px;
    margin-right: 8px;
    padding: 6px 14px;
    border-radius: 999px;
    border: 1px solid var(--divider-color);
    background: var(--card-background-color);
    color: var(--primary-text-color);
    cursor: pointer;
    font-family: inherit;
  }
  .section {
    color: var(--secondary-text-color);
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin: 28px 0 10px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 16px;
  }
  /* README hero screenshot (docs/screenshots/cards-overview-*.png) must NOT
     be captured against this default CSS Grid: row height = tallest card in
     that row, so any shorter neighbor leaves dead space below it (the bug
     reported live more than once). Before take_screenshot, switch #full via
     evaluate_script to a real masonry pack instead:
       full.style.display = 'block';
       full.style.columnCount = '4';
       full.style.columnGap = '16px';
       for (const c of full.children) {
         c.style.breakInside = 'avoid';
         c.style.marginBottom = '16px';
         c.style.display = 'inline-block';
         c.style.width = '100%';
       }
     Also hide #empty via style.setProperty('display','none','important') -
     a plain .hidden/[hidden] loses the specificity fight against .grid's
     own display:grid rule and silently stays visible. */
  /* ha-card / ha-icon are styled from inside their own shadow DOM (see the
     stubs below) - these custom properties are what they read. */
</style>
</head>
<body>
  <h1>suunto-cards dev harness (mock hass, no live HA needed)</h1>
  <button id="toggle" type="button">Toggle dark mode</button>
  <select id="lang">
    <option value="en">English</option>
    <option value="pl">Polski</option>
    <option value="de">Deutsch</option>
    <option value="pt">Português</option>
    <option value="fr">Français</option>
    <option value="es">Español</option>
    <option value="it">Italiano</option>
    <option value="nl">Nederlands</option>
  </select>

  <div class="section">Happy path (full device)</div>
  <div class="grid" id="full"></div>

  <div class="section">Empty / edge states</div>
  <div class="grid" id="empty"></div>

    };
    const DEFAULT_ICON = '<circle cx="12" cy="12" r="8.5"/>';
    const WEATHER_ICON = '<path d="M7 18h10a3.5 3.5 0 0 0 0-7 5 5 0 0 0-9.6-1.5A3.8 3.8 0 0 0 7 18Z"/>';
    function iconBody(name) {
      if (ICON_PATHS[name]) return ICON_PATHS[name];
      if (name && name.startsWith("mdi:weather")) return WEATHER_ICON;
      return DEFAULT_ICON;
    }
    function iconSvg(name) {
      return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">${iconBody(name)}</svg>`;
    }

    customElements.define(
      "ha-icon",
      class extends HTMLElement {
        static get observedAttributes() {
          return ["icon"];
        }
        connectedCallback() {
          if (!this.shadowRoot) {
            this.attachShadow({ mode: "open" });
            this.shadowRoot.innerHTML =
              '<style>:host{display:inline-flex;align-items:center;justify-content:center;width:1em;height:1em;font-size:var(--mdc-icon-size,20px);}svg{display:block;width:100%;height:100%;}</style><span class="slot"></span>';
          }
          this._render();
        }
        attributeChangedCallback() {
          this._render();
        }
        get icon() {
          return this._icon || this.getAttribute("icon");
        }
        set icon(value) {
          this._icon = value;
          this._render();
        }
        _render() {
          const slot = this.shadowRoot && this.shadowRoot.querySelector(".slot");
          if (slot) slot.innerHTML = iconSvg(this.icon);
        }
      }
    );

    import("../dist/suunto-cards.js").then(setup);

    function nowIso(offsetMs = 0) {
      return new Date(Date.now() + offsetMs).toISOString();
    }

    function makeHass({ deviceId, entities, callApiImpl, callWSImpl }) {
      const states = {};
      const registry = {};
      for (const [translationKey, def] of Object.entries(entities)) {
        const domain = def.domain || "sensor";
        const entityId = `${domain}.suunto_${deviceId}_${translationKey}`;
        states[entityId] = {
          entity_id: entityId,
          state: String(def.state),
          attributes: def.attributes || {},
          // Real HA always sets this; cards that gate on "how fresh is this
          // value" (e.g. suunto-just-finished-card) need it in the mock too.
          last_changed: def.last_changed || nowIso(),
        };
        registry[entityId] = {
          entity_id: entityId,
          device_id: deviceId,
          platform: "suunto_app",
          translation_key: translationKey,
        };
      }
      if (deviceId === "full") {
        const gear = [
          ["chain", "Chain", "Cycling", 3120, 3000],
          ["tyres", "Tyres", "Cycling", 4100, 5000],
          ["running_shoes", "Running shoes", "Running", 212, 800],
        ];
        for (const [slug, name, activity, km, interval] of gear) {
          const entityId = `sensor.suunto_${deviceId}_${slug}`;
          states[entityId] = {
            entity_id: entityId,
            state: String(km),
            attributes: {
              friendly_name: `Suunto (${deviceId}) ${name}`,
              activity,
              interval_km: interval,
              remaining_km: interval - km,
              service_due: km >= interval,
            },
            last_changed: nowIso(),
          };
          registry[entityId] = { entity_id: entityId, device_id: deviceId, platform: "suunto_app" };
        }
      }
      return {
        states,
        entities: registry,
        devices: { [deviceId]: { id: deviceId, name: `Suunto (${deviceId})` } },
        themes: { darkMode: document.body.classList.contains("dark") },
        language: "en",
        config: { currency: "PLN" },
        callApi: callApiImpl || (async () => [[]]),
        callWS: callWSImpl || (async () => ({})),
      };
    }

    // Shared trend generator for every history-backed chart card - a slow
    // linear drift plus a sine wobble, tuned per entity to land near that
    // entity's "current" mock state below (see HISTORY_GENERATORS).
    function trendHistory(days, base, dailyDrift, amplitude, noiseSeed = 1) {
      const points = [];
      const now = Date.now();
      for (let i = days; i >= 0; i -= 2) {
        const t = now - i * 86400000;
        const v = base + (days - i) * dailyDrift + Math.sin((i + noiseSeed) / 3) * amplitude;
        points.push({ state: v.toFixed(1), last_updated: new Date(t).toISOString() });
      }
      return points;
    }

    const HISTORY_GENERATORS = {
      fitness_ctl: () => trendHistory(90, 30, 0.2, 2, 1),
      fatigue_atl: () => trendHistory(90, 35, 0.07, 6, 2),
      form_tsb: () => trendHistory(90, -5, 0.09, 5, 3),
      resting_hr: () => trendHistory(30, 51, -0.1, 1.5, 4),
      sleep_hrv: () => trendHistory(30, 50, 0.13, 3, 5),
      weekly_distance: () => trendHistory(84, 45, 0.2, 10, 6),
      weekly_time: () => trendHistory(20, 4.5, 0.02, 0.4, 8),
      // Integer step function for suunto-week-compare-card: 3 workouts/week
      // until exactly 7 days ago, 4/week since - a clean "+1" delta demo.
      workouts_7d: () => {
        const now = Date.now();
        const points = [];
        for (let i = 20; i >= 0; i -= 1) {
          const v = i >= 7 ? 3 : 4;
          points.push({ state: String(v), last_updated: new Date(now - i * 86400000).toISOString() });
        }
        return points;
      },
      // Last 9 wake times (minutes after midnight) - one intentionally late
      // outlier (day -2, ~08:20) for suunto-sleep-rhythm-card's amber tone.
      wake_time: () => {
        const wakeMin = [410, 390, 375, 400, 430, 500, 420, 405, 395];
        const now = Date.now();
        return wakeMin.map((min, i) => {
          const d = new Date(now - (wakeMin.length - 1 - i) * 86400000);
          d.setHours(Math.floor(min / 60), min % 60, 0, 0);
          return { state: d.toISOString(), last_updated: d.toISOString() };
        });
      },
      // Paired 1:1 with wake_time above (same day offsets) so
      // suunto-sleep-rhythm-card can join bedtime = wake - duration per night.
      sleep_duration: () => {
        const hours = [7.75, 6.83, 7.42, 6.33, 7.92, 8.25, 7.5, 7.6, 7.1];
        const now = Date.now();
        return hours.map((h, i) => {
          const d = new Date(now - (hours.length - 1 - i) * 86400000);
          d.setHours(7, 0, 0, 0);
          return { state: h.toFixed(2), last_updated: d.toISOString() };
        });
      },
    };

    // Mock `history/period` - real HA returns one array per requested entity,
    // in the order given by `filter_entity_id`. Entity ids here are shaped
    // `<domain>.suunto_<deviceId>_<translationKey>` (see makeHass), so the
    // translation key is every segment after the first two.
    function historyApiImpl(method, path) {
      if (!path.startsWith("history/period/")) return Promise.resolve([[]]);
      const match = path.match(/filter_entity_id=([^&]+)/);
      if (!match) return Promise.resolve([[]]);
      const ids = decodeURIComponent(match[1]).split(",");
      return Promise.resolve(
        ids.map((id) => {
          const key = id.split("_").slice(2).join("_");
          const gen = HISTORY_GENERATORS[key];
          return gen ? gen() : [];
        })
      );
    }

    // Mock `recorder/statistics_during_period` - the external long-term
    // statistics that suunto-hr-curve-card / suunto-sleep-trends-card read
    // (separate from history/period above, which only covers live entities).
    // stepHours matches real import density: hourly for the 24/7 HR stream,
    // one point per day for the daily sleep stats (ha-suunto only ever
    // writes one non-null hour per night for those) - using the wrong step
    // makes the mock look far noisier than a real account ever would.
    function statisticsTrend(hours, base, stepDrift, amplitude, noiseSeed = 1, stepHours = 2, waveDivisor = 4) {
      const points = [];
      const now = Date.now();
      for (let i = hours; i >= 0; i -= stepHours) {
        const t = now - i * 3600000;
        const step = (hours - i) / stepHours;
        const v = base + step * stepDrift + Math.sin((step + noiseSeed) / waveDivisor) * amplitude;
        points.push({ start: t, mean: Number(v.toFixed(1)), min: Number((v - 3).toFixed(1)), max: Number((v + 4).toFixed(1)) });
      }
      return points;
    }

    // suunto_app:steps / :energy are "sum"-class (ever-increasing cumulative,
    // see dailyTotalsFromCumulative) - the mock must grow monotonically per
    // hour, not oscillate, or the card's client-side diffing goes negative
    // and every day looks empty.
    function cumulativeTrend(hours, dailyTotal, stepHours = 2) {
      const points = [];
      const now = Date.now();
      const perStep = (dailyTotal / 24) * stepHours;
      let cumulative = 100000;
      const steps = [];
      for (let i = hours; i >= 0; i -= stepHours) steps.push(i);
      for (const i of steps) {
        cumulative += perStep * (0.6 + Math.random() * 0.8);
        points.push({ start: now - i * 3600000, sum: Number(cumulative.toFixed(1)) });
      }
      return points;
    }

    // Entity-backed statistics - fitness_ctl/resting_hr/etc are regular HA
    // entities with a state_class, not suunto_app:* external statistics, so
    // the real recorder auto-generates these under the entity_id itself
    // (see suunto-training-load-card.ts and friends, fixed to read this
    // instead of history/period, which only reaches back ~10 days). Reuses
    // the exact trend shape HISTORY_GENERATORS already has for each key,
    // just resampled as {start,mean,min,max} statistics points at a daily
    // step, matching these sensors' real once-a-day update cadence.
    const ENTITY_STATS_GENERATORS = {
      fitness_ctl: () => statisticsTrend(90 * 24, 30, 0.2, 2, 1, 24),
      fatigue_atl: () => statisticsTrend(90 * 24, 35, 0.07, 6, 2, 24),
      form_tsb: () => statisticsTrend(90 * 24, -5, 0.09, 5, 3, 24),
      resting_hr: () => statisticsTrend(30 * 24, 51, -0.1, 1.5, 4, 24),
      sleep_hrv: () => statisticsTrend(30 * 24, 50, 0.13, 3, 5, 24),
      weekly_distance: () => statisticsTrend(84 * 24, 45, 0.2, 10, 6, 24),
    };

    const STATISTICS_GENERATORS = {
      "suunto_app:hr": () => statisticsTrend(26, 68, 0.2, 14, 1, 2),
      "suunto_app:sleep_duration": () => statisticsTrend(30 * 24, 7.2, 0, 0.6, 2, 24),
      "suunto_app:sleep_quality": () => statisticsTrend(30 * 24, 80, 0, 6, 3, 24),
      "suunto_app:steps": () => cumulativeTrend(14 * 24, 8500, 2),
      "suunto_app:energy": () => cumulativeTrend(14 * 24, 620, 2),
      "suunto_app:recovery_balance": () => statisticsTrend(14 * 24, 58, 0, 12, 4, 2, 40),
      "suunto_app:stress": () => statisticsTrend(14 * 24, 2, 0, 1, 5, 2, 40),
      "suunto_app:readiness": () => statisticsTrend(30 * 24, 72, 0, 10, 6, 24),
      "suunto_app:pte": () => statisticsTrend(30 * 24, 2.1, 0, 0.6, 7, 24),
      "suunto_app:epoc": () => statisticsTrend(30 * 24, 35, 0, 15, 8, 24),
      // Sparse, real-shaped: Suunto only computes VO2max from runs/walks, so
      // a 90-day window realistically holds a handful of points, not a dense
      // daily series - unlike the other statistics above.
      "suunto_app:vo2max": () => sparsePoints([[85, 47.5], [55, 48.0], [20, 48.6], [2, 49.0]]),
      "suunto_app:estimated_vo2max": () => sparsePoints([[85, 47.0], [55, 47.6], [20, 48.3], [2, 49.4]]),
    };

    function sparsePoints(pairs) {
      const now = Date.now();
      return pairs.map(([daysAgo, v]) => ({ start: now - daysAgo * 86400000, mean: v, min: v, max: v }));
    }

    function statisticsWSImpl(msg) {
      if (msg.type !== "recorder/statistics_during_period") return Promise.resolve({});
      const id = (msg.statistic_ids || [])[0];
      let gen = STATISTICS_GENERATORS[id];
      if (!gen) {
        // Not a suunto_app:* external id - try it as an entity_id shaped
        // <domain>.suunto_<deviceId>_<translationKey>, same key extraction
        // historyApiImpl already uses.
        const key = id.split("_").slice(2).join("_");
        gen = ENTITY_STATS_GENERATORS[key];
      }
      return Promise.resolve(gen ? { [id]: gen() } : {});
    }

    // ?scenario=degraded - what ha-suunto 1.0.28+ reports when data quality
    // drops: last night's sleep missing (stale night 3 days back, readiness on
    // recovery balance alone), a workout recorded without heart rate (0 bpm,
    // MET-based TSS), and a current HR measured 40 min before the newest record.
    function degradedHass() {
      const hass = fullHass();
      const patch = (key, state, attributes, domain = "sensor") => {
        const s = hass.states[`${domain}.suunto_full_${key}`];
        if (state !== undefined) s.state = String(state);
        if (attributes) s.attributes = { ...s.attributes, ...attributes };
      };
      const oldNight = new Date(Date.now() - 3 * 86400000).toISOString().slice(0, 10);
      patch("sleep_duration", 7.3, { night: oldNight, stale: true });
      patch("readiness", 52, { sleep_night: oldNight, sleep_stale: true });
      patch("last_activity", "Trekking");
      patch("last_avg_hr", 0);
      patch("last_max_hr", 0);
      patch("last_pct_hrmax", 0);
      patch("last_tss", 364.5, { tss_met: 364.5, has_hr: false });
      patch("current_hr", 62, { measured_at: nowIso(-40 * 60 * 1000) });
      return hass;
    }

    function emptyHass() {
      return makeHass({
        deviceId: "empty",
        entities: {
          last_activity: { state: "unknown" },
          sleep_duration: { state: "unknown" },
          recovery_balance: { state: "unknown" },
          fitness_ctl: { state: "unknown" },
        },
      });
    }

    function mount(container, tag, hass, label, extra = {}) {
      const wrap = document.createElement("div");
      const caption = document.createElement("div");
      caption.textContent = label;
      caption.style.cssText = "font-size:11px;color:var(--secondary-text-color);margin-bottom:6px;";
      const el = document.createElement(tag);
      el.setConfig({ type: `custom:${tag}`, ...extra });
      el.hass = hass;
      wrap.appendChild(caption);
      wrap.appendChild(el);
      container.appendChild(wrap);
      return el;
    }

    function setup() {
      const scenario = new URLSearchParams(location.search).get("scenario");
      const full = scenario === "degraded" ? degradedHass() : fullHass();
      const empty = emptyHass();
      const fullEl = document.getElementById("full");
      const emptyEl = document.getElementById("empty");

      for (const tag of CARDS) {
        mount(fullEl, tag, full, tag);
        mount(emptyEl, tag, empty, tag);
      }
      mount(fullEl, "suunto-daily-brief-card", full, "suunto-daily-brief-card (show_insight)", { show_insight: true });

      document.getElementById("toggle").addEventListener("click", () => {
        document.body.classList.toggle("dark");
        const dark = document.body.classList.contains("dark");
        for (const el of document.querySelectorAll("[id] > div > *:last-child")) {
          if (el.hass) el.hass = { ...el.hass, themes: { darkMode: dark } };
        }
      });

      document.getElementById("lang").addEventListener("change", (ev) => {
        const language = ev.target.value;
        for (const el of document.querySelectorAll("[id] > div > *:last-child")) {
          if (el.hass) el.hass = { ...el.hass, language };
        }
      });
    }
