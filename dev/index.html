<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>suunto-cards dev harness</title>
<style>
  :root {
    --primary-text-color: #2e3238;
    --secondary-text-color: #6b7178;
    --divider-color: #e5e2da;
    --card-background-color: #ffffff;
    --ha-card-border-radius: 12px;
    --ha-card-box-shadow: 0 1px 2px rgba(20, 20, 20, 0.06), 0 4px 14px rgba(20, 20, 20, 0.06);
    color-scheme: light;
  }
  body.dark {
    --primary-text-color: #ecedee;
    --secondary-text-color: #9ba1a8;
    --divider-color: rgba(255, 255, 255, 0.09);
    --card-background-color: #1e2124;
    --ha-card-box-shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 6px 20px rgba(0, 0, 0, 0.35);
    color-scheme: dark;
  }
  body {
    margin: 0;
    padding: 24px;
    background: #f4f2ed;
    font-family: Segoe UI, Roboto, Helvetica, Arial, sans-serif;
  }
  body.dark {
    background: #16181b;
  }
  h1 {
    color: var(--primary-text-color);
    font-size: 1.1rem;
  }
  button#toggle {
    margin-bottom: 20px;
    padding: 6px 14px;
    border-radius: 999px;
    border: 1px solid var(--divider-color);
    background: var(--card-background-color);
    color: var(--primary-text-color);
    cursor: pointer;
  }
  .section {
    color: var(--secondary-text-color);
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin: 28px 0 10px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 16px;
  }
  /* ha-card / ha-icon are styled from inside their own shadow DOM (see the
     stubs below) - these custom properties are what they read. */
</style>
</head>
<body>
  <h1>suunto-cards dev harness (mock hass, no live HA needed)</h1>
  <button id="toggle" type="button">Toggle dark mode</button>

  <div class="section">Happy path (full device)</div>
  <div class="grid" id="full"></div>

  <div class="section">Empty / edge states</div>
  <div class="grid" id="empty"></div>

  <script type="module">
    // Minimal stand-ins for the real HA frontend elements this bundle expects.
    // Both need their OWN shadow DOM: page-level CSS cannot reach inside each
    // card's shadow root, only inherited custom properties (--card-background-color
    // etc.) can - that's why these stubs read the same variables the real
    // ha-card/ha-icon would, rather than being styled from dev/index.html's <style>.
    customElements.define(
      "ha-card",
      class extends HTMLElement {
        connectedCallback() {
          if (this.shadowRoot) return;
          const root = this.attachShadow({ mode: "open" });
          root.innerHTML = `
            <style>
              :host {
                display: block;
                background: var(--card-background-color);
                border-radius: var(--ha-card-border-radius, 12px);
                box-shadow: var(--ha-card-box-shadow);
                color: var(--primary-text-color);
              }
            </style>
            <slot></slot>
          `;
        }
      }
    );

    const ICON_PATHS = {
      "mdi:bike": '<circle cx="6" cy="17" r="3.4"/><circle cx="18" cy="17" r="3.4"/><path d="M6 17 9.5 9h4l3 5.2"/><path d="M9.5 9 11.3 6h3"/><path d="M12.3 13.5H19"/>',
      "mdi:run": '<circle cx="14.5" cy="4.6" r="1.5"/><path d="M9 20l2.3-3.8 1-3-2-2 .4-3.8 2.8 1 1.4 2.8h2.8"/>',
      "mdi:hiking": '<path d="M3 17 9 7l3 5 2-3 7 8"/><path d="M9 7 6.3 17"/>',
      "mdi:walk": '<circle cx="14" cy="4.5" r="1.5"/><path d="M11 20l1.5-5-2-2 .5-4 3 .5 1 3h3"/>',
      "mdi:dumbbell": '<rect x="3" y="10" width="3" height="4"/><rect x="18" y="10" width="3" height="4"/><path stroke-width="2.5" d="M7 12h10"/>',
      "mdi:swim": '<path d="M3 17q2-2 4 0t4 0 4 0 4 0 2-2"/><circle cx="17" cy="6" r="1.6"/><path d="M6 12l6-5 3 2-2 3"/>',
      "mdi:ski": '<path d="M4 19h5M15 19h5M6 6l3 13M18 6l-3 13"/>',
      "mdi:rowing": '<path d="M4 20l7-9m9 9l-7-9m-5-2 3-3 3 3"/>',
      "mdi:run-fast": '<circle cx="14.5" cy="4.6" r="1.5"/><path d="M9 20l2.3-3.8 1-3-2-2 .4-3.8 2.8 1 1.4 2.8h2.8"/><path d="M3 18h3M2 15h2"/>',
      "mdi:chevron-right": '<path d="M9 5l7 7-7 7"/>',
      "mdi:heart-pulse": '<path d="M3 12.5h3.5l1.6-3.3 2.4 6.4 1.7-4.5 1.3 2.3H21"/>',
      "mdi:pulse": '<path d="M3 12.5h3.5l1.6-3.3 2.4 6.4 1.7-4.5 1.3 2.3H21"/>',
      "mdi:tag-outline": '<path d="M4 12.5 11.5 5H17a2 2 0 0 1 2 2v5.5L11 20 4 13a1.4 1.4 0 0 1 0-.5Z"/><circle cx="15" cy="9" r="1.1" fill="currentColor" stroke="none"/>',
      "mdi:trophy": '<path d="M7 4h10v4a5 5 0 0 1-10 0V4Z"/><path d="M7 5H4.5A2.5 2.5 0 0 0 7 9"/><path d="M17 5h2.5A2.5 2.5 0 0 1 17 9"/><path d="M12 13v3"/><path d="M9 20h6"/>',
      "mdi:sleep": '<path d="M16.5 4.5a8 8 0 1 0 3 12.4A6.3 6.3 0 0 1 16.5 4.5Z"/>',
      "mdi:power-sleep": '<path d="M16.5 4.5a8 8 0 1 0 3 12.4A6.3 6.3 0 0 1 16.5 4.5Z"/>',
      "mdi:heart-flash": '<path d="M12 20s-7-4.4-9-9a5 5 0 0 1 9-3 5 5 0 0 1 9 3c0 .8-.2 1.6-.5 2.3"/><path d="M14 12l-2 3h3l-2 3"/>',
      "mdi:battery-heart-variant": '<rect x="4" y="7" width="14" height="10" rx="2"/><path d="M20 10v4"/><path d="M6 12h1.6l1-2 1.6 4 1-2H15"/>',
      "mdi:calendar-check": '<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 9h16M8 3v4M16 3v4"/><path d="M8 14l2.5 2.5L16 11"/>',
      "mdi:calendar-week": '<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 9h16M8 3v4M16 3v4M8 13h8"/>',
      "mdi:calendar-blank-outline": '<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 9h16M8 3v4M16 3v4"/>',
      "mdi:scale-balance": '<path d="M12 3v18M6 8l-3 6a3 3 0 0 0 6 0zM18 8l-3 6a3 3 0 0 0 6 0z"/><path d="M6 8h12M9 21h6"/>',
      "mdi:arm-flex": '<path d="M6 18c0-4 1-6 1-9a3 3 0 0 1 6 0c0 2-1 3-1 5h3a3 3 0 0 1 3 3v3"/>',
      "mdi:alert-circle-outline": '<circle cx="12" cy="12" r="8.5"/><path d="M12 8v5"/><circle cx="12" cy="16" r="0.6" fill="currentColor" stroke="none"/>',
      "mdi:bed-clock": '<path d="M3 18v-5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v5"/><path d="M3 18v2M21 18v2"/><path d="M5 11V8a2 2 0 0 1 2-2h3"/><circle cx="17" cy="7" r="3.4"/><path d="M17 5.5V7l1.2.8"/>',
      "mdi:weather-windy": '<path d="M3 8h11a2.2 2.2 0 1 0-2.2-2.6"/><path d="M3 12h15a2.2 2.2 0 1 1-2.2 2.6"/><path d="M3 16h9"/>',
    };
    const DEFAULT_ICON = '<circle cx="12" cy="12" r="8.5"/>';
    const WEATHER_ICON = '<path d="M7 18h10a3.5 3.5 0 0 0 0-7 5 5 0 0 0-9.6-1.5A3.8 3.8 0 0 0 7 18Z"/>';
    function iconBody(name) {
      if (ICON_PATHS[name]) return ICON_PATHS[name];
      if (name && name.startsWith("mdi:weather")) return WEATHER_ICON;
      return DEFAULT_ICON;
    }
    function iconSvg(name) {
      return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">${iconBody(name)}</svg>`;
    }

    customElements.define(
      "ha-icon",
      class extends HTMLElement {
        static get observedAttributes() {
          return ["icon"];
        }
        connectedCallback() {
          if (!this.shadowRoot) {
            this.attachShadow({ mode: "open" });
            this.shadowRoot.innerHTML =
              '<style>:host{display:inline-flex;align-items:center;justify-content:center;width:1em;height:1em;font-size:var(--mdc-icon-size,20px);}svg{display:block;width:100%;height:100%;}</style><span class="slot"></span>';
          }
          this._render();
        }
        attributeChangedCallback() {
          this._render();
        }
        get icon() {
          return this._icon || this.getAttribute("icon");
        }
        set icon(value) {
          this._icon = value;
          this._render();
        }
        _render() {
          const slot = this.shadowRoot && this.shadowRoot.querySelector(".slot");
          if (slot) slot.innerHTML = iconSvg(this.icon);
        }
      }
    );

    import("../dist/suunto-cards.js").then(setup);

    function nowIso(offsetMs = 0) {
      return new Date(Date.now() + offsetMs).toISOString();
    }

    function makeHass({ deviceId, entities, callApiImpl }) {
      const states = {};
      const registry = {};
      for (const [translationKey, def] of Object.entries(entities)) {
        const domain = def.domain || "sensor";
        const entityId = `${domain}.suunto_${deviceId}_${translationKey}`;
        states[entityId] = { entity_id: entityId, state: String(def.state), attributes: def.attributes || {} };
        registry[entityId] = {
          entity_id: entityId,
          device_id: deviceId,
          platform: "suunto_app",
          translation_key: translationKey,
        };
      }
      return {
        states,
        entities: registry,
        devices: { [deviceId]: { id: deviceId, name: `Suunto (${deviceId})` } },
        themes: { darkMode: document.body.classList.contains("dark") },
        language: "en",
        callApi: callApiImpl || (async () => [[]]),
      };
    }

    function ctlHistory(entityId, days = 30, base = 30) {
      const points = [];
      const now = Date.now();
      for (let i = days; i >= 0; i -= 2) {
        const t = now - i * 86400000;
        const v = base + (days - i) * 0.6 + Math.sin(i / 3) * 2;
        points.push({ state: v.toFixed(1), last_updated: new Date(t).toISOString() });
      }
      return points;
    }

    function fullHass() {
      return makeHass({
        deviceId: "full",
        callApiImpl: async (method, path) => {
          if (path.startsWith("history/period/")) return [ctlHistory("fitness_ctl")];
          return [[]];
        },
        entities: {
          last_activity: { state: "Cycling" },
          last_workout_start: { state: nowIso(-2 * 3600 * 1000) },
          last_distance: { state: 42300 },
          last_duration: { state: 98 },
          last_avg_hr: { state: 142 },
          last_max_hr: { state: 168 },
          last_avg_speed: { state: 25.9 },
          last_pte: { state: 1.6 },
          last_epoc: { state: 11.6 },
          last_feeling: { state: 4 },
          last_tss: { state: 132 },
          last_cal_per_km: { state: 32 },
          last_workout_weather: {
            state: 27.2,
            attributes: { humidity_pct: 58, wind_speed_kmh: 12, wind_direction_deg: 210, condition: "Scattered clouds", icon_code: "03d" },
          },
          last_workout_tags: { state: "Commute" },
          last_workout_achievements: { state: 2, attributes: { achievements: ["2nd fastest"], route_ranking: 2 } },
          last_zone1: { state: 5, attributes: { upper_limit_bpm: 111 } },
          last_zone2: { state: 12, attributes: { lower_limit_bpm: 111, upper_limit_bpm: 131 } },
          last_zone3: { state: 30, attributes: { lower_limit_bpm: 131, upper_limit_bpm: 151 } },
          last_zone4: { state: 15, attributes: { lower_limit_bpm: 151, upper_limit_bpm: 168 } },
          last_zone5: { state: 3, attributes: { lower_limit_bpm: 168 } },
          sleep_duration: { state: 7.53 },
          sleep_deep: { state: 92 },
          sleep_light: { state: 210 },
          sleep_rem: { state: 68 },
          sleep_quality: { state: 84 },
          sleep_spo2: { state: 96 },
          sleep_hrv: { state: 54 },
          hrv_baseline: { state: 50 },
          hrv_status: { state: "high" },
          resting_hr: { state: 48 },
          resting_hr_baseline: { state: 51 },
          wake_time: { state: nowIso(-9 * 3600 * 1000) },
          nap_duration: { state: 32, attributes: { nap_count: 1, date: new Date().toISOString().slice(0, 10) } },
          readiness: { state: 78 },
          recovery_balance: { state: 54 },
          is_recovering: { domain: "binary_sensor", state: "on" },
          recovery_until: { state: nowIso(3 * 3600 * 1000 + 20 * 60 * 1000) },
          recovery_time: { state: 8.5 },
          stress_state: { state: 2 },
          workout_today: { domain: "binary_sensor", state: "on" },
          fitness_ctl: { state: 48 },
          fatigue_atl: { state: 41 },
          form_tsb: { state: 3.2 },
          acwr: { state: 1.05 },
          weekly_distance: { state: 62.4 },
          weekly_time: { state: 5.2 },
          workouts_7d: { state: 4 },
          workouts_30d: { state: 14 },
          lifetime_by_activity: {
            state: 5,
            attributes: {
              activities: [
                { activity: "Cycling", workouts: 302, distance_km: 6120, time_hours: 410 },
                { activity: "Trekking", workouts: 47, distance_km: 512, time_hours: 180 },
                { activity: "Gym", workouts: 96, distance_km: 0, time_hours: 72 },
                { activity: "Walking", workouts: 30, distance_km: 145, time_hours: 38 },
                { activity: "Running", workouts: 3, distance_km: 24, time_hours: 3 },
              ],
            },
          },
          daily_steps: { state: 8412 },
          daily_energy: { state: 612 },
          current_hr: { state: 78 },
        },
      });
    }

    function emptyHass() {
      return makeHass({
        deviceId: "empty",
        entities: {
          last_activity: { state: "unknown" },
          sleep_duration: { state: "unknown" },
          recovery_balance: { state: "unknown" },
          fitness_ctl: { state: "unknown" },
        },
      });
    }

    function mount(container, tag, hass, label) {
      const wrap = document.createElement("div");
      const caption = document.createElement("div");
      caption.textContent = label;
      caption.style.cssText = "font-size:11px;color:var(--secondary-text-color);margin-bottom:6px;";
      const el = document.createElement(tag);
      el.setConfig({ type: `custom:${tag}` });
      el.hass = hass;
      wrap.appendChild(caption);
      wrap.appendChild(el);
      container.appendChild(wrap);
      return el;
    }

    const CARDS = [
      "suunto-last-workout-card",
      "suunto-hr-zones-card",
      "suunto-sleep-readiness-card",
      "suunto-recovery-card",
      "suunto-training-load-card",
      "suunto-week-stats-card",
      "suunto-today-card",
    ];

    function setup() {
      const full = fullHass();
      const empty = emptyHass();
      const fullEl = document.getElementById("full");
      const emptyEl = document.getElementById("empty");

      for (const tag of CARDS) {
        mount(fullEl, tag, full, tag);
        mount(emptyEl, tag, empty, tag);
      }

      document.getElementById("toggle").addEventListener("click", () => {
        document.body.classList.toggle("dark");
        const dark = document.body.classList.contains("dark");
        for (const el of document.querySelectorAll("[id] > div > *:last-child")) {
          if (el.hass) el.hass = { ...el.hass, themes: { darkMode: dark } };
        }
      });
    }
  </script>
</body>
</html>
