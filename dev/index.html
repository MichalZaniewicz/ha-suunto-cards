<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>suunto-cards dev harness</title>
<style>
  :root {
    --primary-text-color: #2e3238;
    --secondary-text-color: #6b7178;
    --divider-color: #e5e2da;
    --card-background-color: #ffffff;
    --ha-card-border-radius: 12px;
    --ha-card-box-shadow: 0 1px 2px rgba(20, 20, 20, 0.06), 0 4px 14px rgba(20, 20, 20, 0.06);
    color-scheme: light;
  }
  body.dark {
    --primary-text-color: #ecedee;
    --secondary-text-color: #9ba1a8;
    --divider-color: rgba(255, 255, 255, 0.09);
    --card-background-color: #1e2124;
    --ha-card-box-shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 6px 20px rgba(0, 0, 0, 0.35);
    color-scheme: dark;
  }
  body {
    margin: 0;
    padding: 24px;
    background: #f4f2ed;
    font-family: Segoe UI, Roboto, Helvetica, Arial, sans-serif;
  }
  body.dark {
    background: #16181b;
  }
  h1 {
    color: var(--primary-text-color);
    font-size: 1.1rem;
  }
  button#toggle,
  select#lang {
    margin-bottom: 20px;
    margin-right: 8px;
    padding: 6px 14px;
    border-radius: 999px;
    border: 1px solid var(--divider-color);
    background: var(--card-background-color);
    color: var(--primary-text-color);
    cursor: pointer;
    font-family: inherit;
  }
  .section {
    color: var(--secondary-text-color);
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin: 28px 0 10px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 16px;
  }
  /* ha-card / ha-icon are styled from inside their own shadow DOM (see the
     stubs below) - these custom properties are what they read. */
</style>
</head>
<body>
  <h1>suunto-cards dev harness (mock hass, no live HA needed)</h1>
  <button id="toggle" type="button">Toggle dark mode</button>
  <select id="lang">
    <option value="en">English</option>
    <option value="pl">Polski</option>
    <option value="de">Deutsch</option>
    <option value="pt">Português</option>
    <option value="fr">Français</option>
    <option value="es">Español</option>
    <option value="it">Italiano</option>
    <option value="nl">Nederlands</option>
  </select>

  <div class="section">Happy path (full device)</div>
  <div class="grid" id="full"></div>

  <div class="section">Empty / edge states</div>
  <div class="grid" id="empty"></div>

  <script type="module">
    // Minimal stand-ins for the real HA frontend elements this bundle expects.
    // Both need their OWN shadow DOM: page-level CSS cannot reach inside each
    // card's shadow root, only inherited custom properties (--card-background-color
    // etc.) can - that's why these stubs read the same variables the real
    // ha-card/ha-icon would, rather than being styled from dev/index.html's <style>.
    customElements.define(
      "ha-card",
      class extends HTMLElement {
        connectedCallback() {
          if (this.shadowRoot) return;
          const root = this.attachShadow({ mode: "open" });
          root.innerHTML = `
            <style>
              :host {
                display: block;
                background: var(--card-background-color);
                border-radius: var(--ha-card-border-radius, 12px);
                box-shadow: var(--ha-card-box-shadow);
                color: var(--primary-text-color);
              }
            </style>
            <slot></slot>
          `;
        }
      }
    );

    const ICON_PATHS = {

      "mdi:bed-clock": '<path d="M3 18v-5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v5"/><path d="M3 18v2M21 18v2"/><path d="M5 11V8a2 2 0 0 1 2-2h3"/><circle cx="17" cy="7" r="3.4"/><path d="M17 5.5V7l1.2.8"/>',
      "mdi:weather-windy": '<path d="M3 8h11a2.2 2.2 0 1 0-2.2-2.6"/><path d="M3 12h15a2.2 2.2 0 1 1-2.2 2.6"/><path d="M3 16h9"/>',

      "mdi:format-list-bulleted": '<circle cx="4" cy="6" r="1" fill="currentColor" stroke="none"/><path d="M8 6h12"/><circle cx="4" cy="12" r="1" fill="currentColor" stroke="none"/><path d="M8 12h12"/><circle cx="4" cy="18" r="1" fill="currentColor" stroke="none"/><path d="M8 18h12"/>',
      "mdi:image-filter-hdr": '<path d="M3 18l5-7 3 4 4-6 6 9Z"/>',
      "mdi:map-marker": '<path d="M12 21s7-6.5 7-11.5A7 7 0 0 0 5 9.5C5 14.5 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.2"/>',
      "mdi:open-in-new": '<path d="M9 5H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/><path d="M14 4h6v6"/><path d="M20 4 11 13"/>',
      "mdi:lungs": '<path d="M12 3v7"/><path d="M12 10c-1 0-1.5 1-1.5 3v4c0 1.5-1 2.5-2.5 2.5S5.5 18.5 5.5 17v-5c0-2 1-3.5 3-3.5"/><path d="M12 10c1 0 1.5 1 1.5 3v4c0 1.5 1 2.5 2.5 2.5S18.5 18.5 18.5 17v-5c0-2-1-3.5-3-3.5"/>',
      "mdi:trending-up": '<path d="M4 16l5-4.5 3.3 3 7-8"/><path d="M14.5 6.5h5v5"/>',
      "mdi:chart-timeline-variant": '<path d="M3 17l4-6 3 3 4-8 3 5 4-4"/><path d="M3 20h18"/>',
      "mdi:chart-bar": '<path d="M4 20V10M9 20V6M14 20V13M19 20V4"/><path d="M3 20h18"/>',
      "mdi:chart-bell-curve": '<path d="M3 19h18"/><path d="M4 19c2.5-.3 3.5-9 8-9s5.5 8.7 8 9"/>',
      "mdi:target": '<circle cx="12" cy="12" r="8.2"/><circle cx="12" cy="12" r="4.6"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/>',
      "mdi:fire": '<path d="M12 21a5.6 5.6 0 0 0 5.6-5.6c0-2.7-1.7-4.2-2.6-6.4-.2 1.8-1.3 2.5-2 1.3-.9-1.5-.4-3.4.4-5.8-3 1.6-4.9 4.3-4.9 7.6 0 1 .2 1.9.7 2.7-1-.4-1.7-1.3-1.9-2.4-.8 1.4-1.2 2.9-1.2 4.6A5.6 5.6 0 0 0 12 21Z"/>',
      "mdi:party-popper": '<path d="M4 20l2.6-7.8 5.2 5.2L4 20Z"/><path d="M12.5 6l1.5 1.5M16.5 4l.5 2M19.5 7.5l-2 1"/><circle cx="17.5" cy="11" r="0.9" fill="currentColor" stroke="none"/><circle cx="13.5" cy="15" r="0.9" fill="currentColor" stroke="none"/>',
    };
    const DEFAULT_ICON = '<circle cx="12" cy="12" r="8.5"/>';
    const WEATHER_ICON = '<path d="M7 18h10a3.5 3.5 0 0 0 0-7 5 5 0 0 0-9.6-1.5A3.8 3.8 0 0 0 7 18Z"/>';
    function iconBody(name) {
      if (ICON_PATHS[name]) return ICON_PATHS[name];
      if (name && name.startsWith("mdi:weather")) return WEATHER_ICON;
      return DEFAULT_ICON;
    }
    function iconSvg(name) {
      return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">${iconBody(name)}</svg>`;
    }

    customElements.define(
      "ha-icon",
      class extends HTMLElement {
        static get observedAttributes() {
          return ["icon"];
        }
        connectedCallback() {
          if (!this.shadowRoot) {
            this.attachShadow({ mode: "open" });
            this.shadowRoot.innerHTML =
              '<style>:host{display:inline-flex;align-items:center;justify-content:center;width:1em;height:1em;font-size:var(--mdc-icon-size,20px);}svg{display:block;width:100%;height:100%;}</style><span class="slot"></span>';
          }
          this._render();
        }
        attributeChangedCallback() {
          this._render();
        }
        get icon() {
          return this._icon || this.getAttribute("icon");
        }
        set icon(value) {
          this._icon = value;
          this._render();
        }
        _render() {
          const slot = this.shadowRoot && this.shadowRoot.querySelector(".slot");
          if (slot) slot.innerHTML = iconSvg(this.icon);
        }
      }
    );

    import("../dist/suunto-cards.js").then(setup);

    function nowIso(offsetMs = 0) {
      return new Date(Date.now() + offsetMs).toISOString();
    }

    function makeHass({ deviceId, entities, callApiImpl, callWSImpl }) {
      const states = {};
      const registry = {};
      for (const [translationKey, def] of Object.entries(entities)) {
        const domain = def.domain || "sensor";
        const entityId = `${domain}.suunto_${deviceId}_${translationKey}`;
        states[entityId] = {
          entity_id: entityId,
          state: String(def.state),
          attributes: def.attributes || {},
          // Real HA always sets this; cards that gate on "how fresh is this
          // value" (e.g. suunto-just-finished-card) need it in the mock too.
          last_changed: def.last_changed || nowIso(),
        };
        registry[entityId] = {
          entity_id: entityId,
          device_id: deviceId,
          platform: "suunto_app",
          translation_key: translationKey,
        };
      }
      return {
        states,
        entities: registry,
        devices: { [deviceId]: { id: deviceId, name: `Suunto (${deviceId})` } },
        themes: { darkMode: document.body.classList.contains("dark") },
        language: "en",
        callApi: callApiImpl || (async () => [[]]),
        callWS: callWSImpl || (async () => ({})),
      };
    }

    // Shared trend generator for every history-backed chart card - a slow
    // linear drift plus a sine wobble, tuned per entity to land near that
    // entity's "current" mock state below (see HISTORY_GENERATORS).
    function trendHistory(days, base, dailyDrift, amplitude, noiseSeed = 1) {
      const points = [];
      const now = Date.now();
      for (let i = days; i >= 0; i -= 2) {
        const t = now - i * 86400000;
        const v = base + (days - i) * dailyDrift + Math.sin((i + noiseSeed) / 3) * amplitude;
        points.push({ state: v.toFixed(1), last_updated: new Date(t).toISOString() });
      }
      return points;
    }

    const HISTORY_GENERATORS = {
      fitness_ctl: () => trendHistory(90, 30, 0.2, 2, 1),
      fatigue_atl: () => trendHistory(90, 35, 0.07, 6, 2),
      form_tsb: () => trendHistory(90, -5, 0.09, 5, 3),
      resting_hr: () => trendHistory(30, 51, -0.1, 1.5, 4),
      sleep_hrv: () => trendHistory(30, 50, 0.13, 3, 5),
      weekly_distance: () => trendHistory(84, 45, 0.2, 10, 6),
    };

    // Mock `history/period` - real HA returns one array per requested entity,
    // in the order given by `filter_entity_id`. Entity ids here are shaped
    // `<domain>.suunto_<deviceId>_<translationKey>` (see makeHass), so the
    // translation key is every segment after the first two.
    function historyApiImpl(method, path) {
      if (!path.startsWith("history/period/")) return Promise.resolve([[]]);
      const match = path.match(/filter_entity_id=([^&]+)/);
      if (!match) return Promise.resolve([[]]);
      const ids = decodeURIComponent(match[1]).split(",");
      return Promise.resolve(
        ids.map((id) => {
          const key = id.split("_").slice(2).join("_");
          const gen = HISTORY_GENERATORS[key];
          return gen ? gen() : [];
        })
      );
    }

    // Mock `recorder/statistics_during_period` - the external long-term
    // statistics that suunto-hr-curve-card / suunto-sleep-trends-card read
    // (separate from history/period above, which only covers live entities).
    // stepHours matches real import density: hourly for the 24/7 HR stream,
    // one point per day for the daily sleep stats (ha-suunto only ever
    // writes one non-null hour per night for those) - using the wrong step
    // makes the mock look far noisier than a real account ever would.
    function statisticsTrend(hours, base, stepDrift, amplitude, noiseSeed = 1, stepHours = 2) {
      const points = [];
      const now = Date.now();
      for (let i = hours; i >= 0; i -= stepHours) {
        const t = now - i * 3600000;
        const step = (hours - i) / stepHours;
        const v = base + step * stepDrift + Math.sin((step + noiseSeed) / 4) * amplitude;
        points.push({ start: t, mean: Number(v.toFixed(1)), min: Number((v - 3).toFixed(1)), max: Number((v + 4).toFixed(1)) });
      }
      return points;
    }

    const STATISTICS_GENERATORS = {
      "suunto_app:hr": () => statisticsTrend(26, 68, 0.2, 14, 1, 2),
      "suunto_app:sleep_duration": () => statisticsTrend(30 * 24, 7.2, 0, 0.6, 2, 24),
      "suunto_app:sleep_quality": () => statisticsTrend(30 * 24, 80, 0, 6, 3, 24),
    };

    function statisticsWSImpl(msg) {
      if (msg.type !== "recorder/statistics_during_period") return Promise.resolve({});
      const id = (msg.statistic_ids || [])[0];
      const gen = STATISTICS_GENERATORS[id];
      return Promise.resolve(gen ? { [id]: gen() } : {});
    }

    function fullHass() {
      return makeHass({
        deviceId: "full",
        callApiImpl: historyApiImpl,
        callWSImpl: statisticsWSImpl,
        entities: {

                { start: nowIso(-2 * 3600 * 1000), activity: "Cycling", distance_km: 42.3, duration_min: 98, avg_hr: 142, max_hr: 168, tss: 132 },
                { start: nowIso(-30 * 3600 * 1000), activity: "Gym", distance_km: null, duration_min: 52, avg_hr: 118, max_hr: 145, tss: 61 },
                { start: nowIso(-78 * 3600 * 1000), activity: "Trekking", distance_km: 12.8, duration_min: 165, avg_hr: 126, max_hr: 158, tss: 110 },
              ],
            },
          },

            attributes: { latitude: 52.40632, longitude: 16.92592 },
          },
          vo2max: { state: 49, attributes: { measured_at: nowIso(-20 * 86400000), measured_from: "Walking" } },
          estimated_vo2max: { state: 49.4, attributes: { measured_at: nowIso(-20 * 86400000), measured_from: "Walking" } },
          fitness_age: { state: 20, attributes: { measured_at: nowIso(-20 * 86400000), measured_from: "Walking" } },
        },
      });
    }

    function emptyHass() {
      return makeHass({
        deviceId: "empty",
        entities: {
          last_activity: { state: "unknown" },
          sleep_duration: { state: "unknown" },
          recovery_balance: { state: "unknown" },
          fitness_ctl: { state: "unknown" },
        },
      });
    }

    function mount(container, tag, hass, label) {
      const wrap = document.createElement("div");
      const caption = document.createElement("div");
      caption.textContent = label;
      caption.style.cssText = "font-size:11px;color:var(--secondary-text-color);margin-bottom:6px;";
      const el = document.createElement(tag);
      el.setConfig({ type: `custom:${tag}` });
      el.hass = hass;
      wrap.appendChild(caption);
      wrap.appendChild(el);
      container.appendChild(wrap);
      return el;
    }

    const CARDS = [
      "suunto-last-workout-card",
      "suunto-hr-zones-card",
      "suunto-sleep-readiness-card",
      "suunto-recovery-card",
      "suunto-training-load-card",
      "suunto-week-stats-card",
      "suunto-today-card",
      "suunto-lifetime-card",
      "suunto-recent-workouts-card",
      "suunto-elevation-card",
      "suunto-location-card",
      "suunto-fitness-card",
      "suunto-last-workout-tile-card",
      "suunto-pmc-card",
      "suunto-recovery-trends-card",
      "suunto-weekly-volume-card",
      "suunto-hr-curve-card",
      "suunto-sleep-trends-card",
      "suunto-weekly-goal-card",
      "suunto-streak-card",
      "suunto-just-finished-card",
    ];

    function setup() {
      const full = fullHass();
      const empty = emptyHass();
      const fullEl = document.getElementById("full");
      const emptyEl = document.getElementById("empty");

      for (const tag of CARDS) {
        mount(fullEl, tag, full, tag);
        mount(emptyEl, tag, empty, tag);
      }

      document.getElementById("toggle").addEventListener("click", () => {
        document.body.classList.toggle("dark");
        const dark = document.body.classList.contains("dark");
        for (const el of document.querySelectorAll("[id] > div > *:last-child")) {
          if (el.hass) el.hass = { ...el.hass, themes: { darkMode: dark } };
        }
      });

      document.getElementById("lang").addEventListener("change", (ev) => {
        const language = ev.target.value;
        for (const el of document.querySelectorAll("[id] > div > *:last-child")) {
          if (el.hass) el.hass = { ...el.hass, language };
        }
      });
    }
  </script>
</body>
</html>
